function renderItinerary(){var e=document.getElementById("content");e.innerHTML='<div class="section-title">📅 每日行程 · 精确时间表</div>';itineraryData.forEach(function(d){var c=d.type==="flight"?"flight":d.type==="stay"?"rest":d.type==="long"?"long":"drive";var i=d.type==="flight"?"✈️":d.type==="stay"?"😴":"🚗";var h='<div class="day-card" onclick="toggleDay(this)"><div class="day-header"><div class="day-num '+c+'">'+i+'</div><div class="day-info"><div class="date">'+d.date+'</div><div class="title">'+d.title+'</div><div class="route">'+d.route+(d.drive!=="—"?" · "+d.drive:"")+'</div></div><div class="day-arrow">▶</div></div><div class="day-body"><div class="info-row">';if(d.drive!=="—")h+='<span class="info-tag drive">🚗 '+d.drive+'</span>';if(d.driveTime!=="—")h+='<span class="info-tag drive">⏱ '+d.driveTime+'</span>';h+='</div>';if(d.schedule&&d.schedule.length){h+='<h4>⏰ 时间表</h4><table class="schedule-table">';d.schedule.forEach(function(s){h+='<tr><td>'+s.t+'</td><td>'+s.a+'</td></tr>'});h+='</table>'}if(d.highlights.length){h+='<h4>🌟 今日亮点</h4><ul>';d.highlights.forEach(function(hh){h+='<li>'+hh+'</li>'});h+='</ul>'}if(d.food.length){h+='<h4>🍜 美食推荐</h4><ul>';d.food.forEach(function(ff){h+='<li>'+ff+'</li>'});h+='</ul>'}if(d.hotel!=="—"){h+='<h4>🏨 住宿推荐</h4>';h+='<p style="font-size:12px;color:#5a4d3a;line-height:1.8">'+d.hotel+'</p>'}if(d.tips)h+='<div class="highlight">💡 '+d.tips+'</div>';h+='</div></div>';e.innerHTML+=h})}

function _loadLeaflet(cb){if(window.L){cb();return}if(_leafletLoaded){return}_leafletLoaded=true;var s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.onload=function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(l);cb()};s.onerror=function(){_leafletLoaded=false;cb()};document.head.appendChild(s)}
function renderMap(){var e=document.getElementById("content");e.innerHTML='<div class="section-title">🗺️ 路线地图</div><div id="map-view"><div class="map-fallback"><div class="icon">🗺️</div><div class="title">地图加载中...</div><div class="desc">如长时间无反应，说明网络不通，可查看其他Tab</div></div></div><div style="padding:0 4px"><p style="font-size:13px;color:#6b5e4e;line-height:1.7">乌鲁木齐 → 天池 → 可可托海 → 禾木 → 喀纳斯 → 福海（乌伦古湖）→ 魔鬼城 → 赛里木湖 → 果子沟 → 伊宁 → 特克斯 → 那拉提 → 巴音布鲁克 → 独库公路 → 乌鲁木齐</p></div>';_loadLeaflet(function(){if(typeof L==="undefined"){var mv=document.getElementById("map-view");mv.innerHTML='<div class="map-fallback"><div class="icon">🗺️</div><div class="title">地图需要网络连接</div><div class="desc">行程、攻略、预算可离线查看</div></div>';return}var mv=document.getElementById("map-view");mv.innerHTML="";mv.style.cssText="";var map=L.map("map-view").setView([45.5,85.0],6);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; OpenStreetMap',maxZoom:15}).addTo(map);var latlngs=[];mapWaypoints.forEach(function(wp){var m=L.marker([wp.lat,wp.lon]).addTo(map);var d=itineraryData.find(function(dd){return dd.day===wp.day})||{title:wp.label};m.bindPopup("<strong>Day"+wp.day+"</strong><br>"+wp.label+"<br><small>"+(d.title||"")+"</small>");latlngs.push([wp.lat,wp.lon])});L.polyline(latlngs,{color:"#2d5a3f",weight:3,opacity:.7,dashArray:"8,6"}).addTo(map);setTimeout(function(){map.invalidateSize()},200)})}
function renderTips(){var e=document.getElementById("content");e.innerHTML='<div class="section-title">📋 实用攻略</div><div class="tips-card"><h3><span class="icon">🌤️</span>天气与穿衣</h3><ul><li>北疆7-8月白天25-35°C，夜晚山区10-15°C</li><li>乌鲁木齐/克拉玛依偏热，喀纳斯/巴音布鲁克早晚需外套</li><li>必备：短袖+长裤+防晒衣+抓绒衣+防风外套（冲锋衣最佳）</li><li>帽子、墨镜、防晒霜（紫外线很强！）</li><li>舒适的徒步鞋/运动鞋</li></ul></div><div class="tips-card"><h3><span class="icon">🚗</span>自驾注意事项</h3><ul><li>租车建议SUV（坦克300/RAV4/奇骏），约300-500元/天</li><li>新疆加油站需刷身份证+人脸识别，由加油员操作</li><li>独库公路7座以下车辆可通行，注意限行时间</li><li>山区路段注意落石、牛羊横穿</li><li>提前下载离线地图（新疆部分路段无信号）</li><li>后备箱备水和干粮，有些路段服务区少</li><li>布尔津是喀纳斯地区最后一个大补给站，南下时记得加油</li></ul></div><div class="tips-card"><h3><span class="icon">📝</span>必备证件</h3><ul><li>身份证（新疆安检多，随身携带！）</li><li>驾驶证+行驶证（租车用）</li><li>少量现金（有些牧区只收现金）</li></ul></div><div class="tips-card"><h3><span class="icon">🏔️</span>景点门票参考</h3><ul><li>天山天池：门票+区间车约155元</li><li>可可托海：门票+区间车约126元</li><li>禾木村：门票+区间车约102元</li><li>喀纳斯：门票+区间车约230元，观鱼台另约20元</li><li>乌伦古湖黄金海岸：约45元</li><li>乌尔禾魔鬼城：门票+小火车约62元</li><li>赛里木湖：门票约70元，自驾环湖另收费</li><li>特克斯八卦城观景塔：约20元</li><li>那拉提：门票+区间车约135元（空中草原）</li><li>巴音布鲁克：门票+区间车约140元</li><li>独库公路：免费</li></ul></div><div class="tips-card"><h3><span class="icon">🏨</span>酒店预订提醒</h3><ul><li>🔥 禾木和赛里木湖住宿最紧张，务必提前一周以上预订</li><li>喀纳斯景区内木屋数量有限，旺季建议提前5天</li><li>巴音布鲁克海拔高，夏天晚上也冷，选酒店比蒙古包舒服</li><li>携程/去哪儿都可订，注意看真实住客评价</li><li>新疆旺季（7-8月）价格普遍上浮30-50%，正常现象</li></ul></div><div class="tips-card"><h3><span class="icon">📱</span>实用APP</h3><ul><li>高德/百度地图（提前下载新疆离线地图包）</li><li>携程/去哪儿（酒店、门票预订）</li><li>一嗨租车/神州租车</li><li>大众点评（找美食）</li><li>小红书（查最新攻略、路况）</li></ul></div>'}
function renderBudget(){var e=document.getElementById("content");var items=[["✈️ 往返机票（北京-乌鲁木齐）","2人 × ~3000元","6,000"],["🚗 租车（SUV，12天）","12天 × ~400元/天","4,800"],["⛽ 油费","~3500km ÷ 100 × 10L × 8元","2,800"],["🛣️ 过路费","高速+国道","~900"],["🏨 住宿（13晚）","13晚 × ~380元","4,940"],["🎫 景点门票（2人）","约11个景点","~4,200"],["🍜 餐饮","14天 × 2人 × ~150元","4,200"],["🅿️ 停车+区间车等杂费","","~1,200"],["📱 其他（零食、纪念品等）","","~2,000"]];var t=0,h='<div class="section-title">💰 预算估算</div><div class="tips-card"><table class="budget-table">';items.forEach(function(i){h+='<tr><td>'+i[0]+'</td><td style="font-size:11px;color:#9b8c7a">'+i[1]+'</td><td>¥'+i[2]+'</td></tr>';t+=parseInt(i[2].replace(/,/g,""))});h+='<tr class="total"><td colspan="2">合计（2人）</td><td>¥'+t.toLocaleString()+'</td></tr>';h+='</table><p style="font-size:12px;color:#9b8c7a;margin-top:8px">*两人出行估算，实际浮动因人而异。人均约16,000元左右。</p></div>';e.innerHTML=h}
