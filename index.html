乌伦古湖）",route:"喀纳斯 → 福海",drive:"约350km",driveTime:"驾驶约5h",highlights:["上午离开喀纳斯，经布尔津南下（可在此补给加油）","下午抵达福海县，游览乌伦古湖","黄金海岸——戈壁中的金色沙滩，被称为戈壁大海","湖边漫步、观鸟","傍晚看戈壁湖泊日落","晚餐品尝乌伦古湖鱼宴（狗鱼、五道黑等湖鲜）"],food:["午餐：布尔津","晚餐：福海县（强烈推荐乌伦古湖全鱼宴！）"],hotel:"福海县城酒店（约200-350元/晚）",tips:"乌伦古湖是新疆第二大淡水湖。黄金海岸景区门票约45元。福海鱼是特色，一定要尝！县城酒店选择有限，建议提前预订。"},{day:8,date:"8月1日 周五",type:"drive",title:"福海 → 乌尔禾魔鬼城 → 克拉玛依",route:"福海 → 和什托洛盖 → 乌尔禾 → 克拉玛依",drive:"约350km",driveTime:"驾驶约4.5h",highlights:["上午出发，经和什托洛盖南下","下午到达乌尔禾魔鬼城","雅丹地貌，日落时分光影最佳","景区小火车游览（约1.5h）","晚上抵达石油之城克拉玛依"],food:["午餐：和什托洛盖或乌尔禾","晚餐：克拉玛依市区（烤肉、拌面）"],hotel:"克拉玛依市区酒店（约250-400元/晚）",tips:"魔鬼城日落约21:30（新疆时间），下午晚些进园最佳。景区有区间小火车，全程约1.5h。"},{day:9,date:"8月2日 周六",type:"drive",title:"克拉玛依 → 赛里木湖",route:"克拉玛依 → 赛里木湖",drive:"约550km",driveTime:"驾驶约5.5h（高速）",highlights:["沿G30连霍高速一路向西","途经奎屯、精河","下午到达赛里木湖——大西洋最后一滴眼泪","环湖游览（约90km环湖路），随时停车拍照","湖边看日落，湖水湛蓝如海"],food:["午餐：精河或五台服务区","晚餐：赛湖附近/果子沟农家乐（高白鲑鱼）"],hotel:"赛湖景区内毡房/房车营地或果子沟/清水河镇（约300-600元/晚）",tips:"赛里木湖海拔2073m，湖边风大，带防风外套。环湖建议逆时针方向，光线更好。自驾环湖需另付费用。"},{day:10,date:"8月3日 周日",type:"drive",title:"赛里木湖 → 果子沟 → 伊宁",route:"赛里木湖 → 果子沟大桥 → 伊宁",drive:"约200km",driveTime:"驾驶约3h",highlights:["早上再看赛湖晨景","经果子沟大桥（峡谷高桥，工程奇迹，观景台停车拍照）","下午到达伊宁","逛喀赞其民俗旅游区（蓝色小镇，维吾尔风情）","伊犁河大桥看日落"],food:["午餐：果子沟或芦草沟","晚餐：伊宁市区（艾尼纳面馆、手工冰淇淋）"],hotel:"伊宁市区酒店（约250-450元/晚）",tips:"果子沟大桥有专门的观景台。喀赞其适合下午光线柔和时拍照，蓝色小巷非常出片。"},{day:11,date:"8月4日 周一",type:"drive",title:"伊宁 → 那拉提草原",route:"伊宁 → 那拉提",drive:"约250km",driveTime:"驾驶约3.5h",highlights:["沿伊犁河谷东行，一路河谷风光","途经巩留、新源","下午到达那拉提草原","空中草原（坐区间车上山，视野开阔）","草原漫步、骑马、拍照"],food:["午餐：新源县或沿途","晚餐：那拉提镇（羊肉串、手抓饭）"],hotel:"那拉提镇酒店/民宿（约300-600元/晚）",tips:"那拉提分空中草原和河谷草原两区，优先选空中草原。区间车约60-100元。注意防晒。"},{day:12,date:"8月5日 周二",type:"drive",title:"那拉提 → 巴音布鲁克",route:"那拉提 → 巴音布鲁克（独库中段）",drive:"约200km",driveTime:"驾驶约3.5h",highlights:["上午可继续游览那拉提河谷草原","中午进入独库公路中段——绝美高山草原公路","下午到达巴音布鲁克","游览天鹅湖","🌅 重点：九曲十八弯日落（可看到9个太阳倒影）"],food:["午餐：那拉提镇","晚餐：巴音布鲁克镇"],hotel:"巴音布鲁克镇酒店/蒙古包（约300-500元/晚）",tips:"巴音布鲁克海拔约2500m，注意保暖。九曲十八弯日落是重头戏，提前占好机位！日落约21:30。区间车到九曲十八弯约 function renderTips(){var e=document.getElementById("content");e.innerHTML='<div class="section-title">📋 实用攻略</div><div class="tips-card"><h3><span class="icon">🌤️</span>天气与穿衣</h3><ul><li>北疆7-8月白天25-35°C，夜晚山区10-15°C</li><li>乌鲁木齐/克拉玛依偏热，喀纳斯/巴音布鲁克早晚需外套</li><li>必备：短袖+长裤+防晒衣+抓绒衣+防风外套（冲锋衣最佳）</li><li>帽子、墨镜、防晒霜（紫外线很强！）</li><li>舒适的徒步鞋/运动鞋</li></ul></div><div class="tips-card"><h3><span class="icon">🚗</span>自驾注意事项</h3><ul><li>租车建议SUV（坦克300/RAV4/奇骏），约300-500元/天</li><li>新疆加油站需刷身份证+人脸识别，由加油员操作</li><li>独库公路7座以下车辆可通行，注意限行时间</li><li>山区路段注意落石、牛羊横穿</li><li>提前下载离线地图（新疆部分路段无信号）</li><li>后备箱备水和干粮，有些路段服务区少</li><li>布尔津是喀纳斯地区最后一个大补给站，南下时记得加油</li></ul></div><div class="tips-card"><h3><span class="icon">📝</span>必备证件</h3><ul><li>身份证（新疆安检多，随身携带！）</li><li>驾驶证+行驶证（租车用）</li><li>少量现金（有些牧区只收现金）</li></ul></div><div class="tips-card"><h3><span class="icon">🏔️</span>景点门票参考</h3><ul><li>天山天池：门票+区间车约155元</li><li>可可托海：门票+区间车约126元</li><li>禾木村：门票+区间车约102元</li><li>喀纳斯：门票+区间车约230元，观鱼台另约20元</li><li>乌伦古湖黄金海岸：约45元</li><li>乌尔禾魔鬼城：门票+小火车约62元</li><li>赛里木湖：门票约70元，自驾环湖另收费</li><li>那拉提：门票+区间车约135元（空中草原）</li><li>巴音布鲁克：门票+区间车约140元</li><li>独库公路：免费（最美公路果然免费😄）</li></ul></div><div class="tips-card"><h3><span class="icon">📱</span>实用APP</h3><ul><li>高德/百度地图（提前下载新疆离线地图包）</li><li>携程/去哪儿（酒店、门票预订）</li><li>一嗨租车/神州租车</li><li>大众点评（找美食）</li><li>小红书（查最新攻略、路况）</li></ul></div>'}
