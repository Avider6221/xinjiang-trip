function switchTab(n){var ts=document.querySelectorAll(".tab");for(var i=0;i<ts.length;i++)ts[i].classList.remove("active");document.querySelector('[data-tab="'+n+'"]').classList.add("active");document.getElementById("content").innerHTML="";if(n==="itinerary")renderItinerary();else if(n==="map")renderMap();else if(n==="tips")renderTips();else if(n==="budget")renderBudget()}
